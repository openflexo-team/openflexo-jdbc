dependencies {
    implementation flexoFoundation()

    implementation commonsDbutils()

    // Don't know why, but required for use in GEVE project
    implementation hsqldb()
    implementation hsqldbSqltool()

    api "org.hibernate:hibernate-core:${hbn_version}"
    // Hibernate 5.2 generates its proxies with javassist, and the 3.20 it declares fails on Java 17
    // (reflective ClassLoader.defineClass): require a version that defines classes through a Lookup.
    // pamela used to bring this version, until it dropped javassist (PAMELA-F-1).
    api group: 'org.javassist', name: 'javassist', version: '3.30.2-GA'

    // Hibernate 5.2 reads its configuration through JAXB (javax.xml.bind), which is no longer part of the JDK
    // since Java 11. Goes away with Hibernate 6 (jakarta.xml.bind).
    runtimeOnly 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.3'
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:2.3.3'

    testImplementation flexoFoundationTest()

    // Test resource center
    testRuntimeOnly project(':jdbc-ta-test-rc')

}
